server:
  port: 8091

spring:
  application:
    name: spring-zipkin-server

#Zipkin and Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0       # 1.0 - Trace 100% requests, 0.1 - Trace 10% requests
  zipkin:
    tracing:
      endpoint: http://localhost:8092/api/v2/spans

#Logging Pattern Configuration
logging:
  pattern:
    level: "%5p [traceId=%X{traceId} spanId=%X{spanId}]"

#Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# Service URLs
application:
  product:
    service:
      url: http://localhost:8089/product